spring.application.name=online-bookstore
# MySQL 8 uses caching_sha2_password; allowPublicKeyRetrieval lets a local, non-SSL connection authenticate.
# See docs/LOCAL_SETUP.md for the dedicated bookstore_app user (database/create_app_user.sql).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/online_bookstore?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# Fail within 10 seconds with a clear error instead of hanging when MySQL is not reachable.
spring.datasource.hikari.connection-timeout=10000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
server.port=8080
bookstore.shipping=${BOOKSTORE_SHIPPING:0}
bookstore.tax-rate=${BOOKSTORE_TAX_RATE:0}
bookstore.discount=${BOOKSTORE_DISCOUNT:0}