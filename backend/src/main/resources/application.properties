spring.application.name=online-bookstore
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/online_bookstore}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
server.port=8080
bookstore.shipping=${BOOKSTORE_SHIPPING:0}
bookstore.tax-rate=${BOOKSTORE_TAX_RATE:0}
bookstore.discount=${BOOKSTORE_DISCOUNT:0}